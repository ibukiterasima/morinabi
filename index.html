<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8FAF72">

  <title>もりナビ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>もりナビ</h1>
    <p>見ながら置くだけ。おしゃれな盛り付け。</p>
  </header>

  <main>

    <section class="welcome">
      <h2>盛り付けを選ぼう</h2>
      <p>好きなカテゴリーから選んでね。</p>
    </section>

    <section class="categories">

      <button class="category" onclick="showDish('classic')">
        <span>定番</span>
      </button>

      <button class="category" onclick="showDish('cafe')">
        <span>カフェ風</span>
      </button>

      <button class="category" onclick="showDish('japanese food')">
        <span>和食</span>
      </button>

      <button class="category" onclick="showDish('western-style food')">
        <span>洋食</span>
      </button>

      <button class="category" onclick="showDish('pasta')">
        <span>麺・パスタ</span>
      </button>

      <button class="category" onclick="showDish('udon')">
        <span>うどん</span>
      </button>

      <button class="category" onclick="showDish('fruit')">
        <span>フルーツ</span>
      </button>

      <button class="category" onclick="showDish('desert1')">
        <span>デザート</span>
      </button>

      <button class="category" onclick="showDish('desert2')">
        <span>デザート 2</span>
      </button>

    </section>

    <section id="dishArea" class="dish-area">

      <p class="hint">
        カテゴリーを選ぶと<br>
        盛り付けガイドが表示されます。
      </p>

    </section>

  </main>

  <footer>
    <p>もりナビ</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
