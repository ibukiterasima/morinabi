<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8FAF72">

  <title>もりナビ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       ホーム画面
       ========================= -->

  <div id="homeScreen" class="screen active">

    <header class="header">
      <div class="logo">もりナビ</div>
    </header>


    <main class="home-main">

      <section class="hero">
        <h1>盛り付けを選ぼう</h1>
        <p>好きなカテゴリーから選んでね。</p>
      </section>


      <section class="categories">

        <button class="category" onclick="showDish('classic')">
          <img src="classic.PNG" alt="定番">
          <span>定番</span>
        </button>

        <button class="category" onclick="showDish('cafe')">
          <img src="cafe.PNG" alt="カフェ風">
          <span>カフェ風</span>
        </button>

        <button class="category" onclick="showDish('japanese food')">
          <img src="japanese food.PNG" alt="和食">
          <span>和食</span>
        </button>

        <button class="category" onclick="showDish('western-style food')">
          <img src="western-style food.PNG" alt="洋食">
          <span>洋食</span>
        </button>

        <button class="category" onclick="showDish('pasta')">
          <img src="pasta.PNG" alt="麺・パスタ">
          <span>麺・パスタ</span>
        </button>

        <button class="category" onclick="showDish('udon')">
          <img src="udon.PNG" alt="うどん">
          <span>うどん</span>
        </button>

        <button class="category" onclick="showDish('fruit')">
          <img src="fruit.jpg" alt="フルーツ">
          <span>フルーツ</span>
        </button>

        <button class="category" onclick="showDish('desert1')">
          <img src="desert1.PNG" alt="デザート">
          <span>デザート</span>
        </button>

        <button class="category" onclick="showDish('desert2')">
          <img src="desert2.PNG" alt="デザート2">
          <span>デザート 2</span>
        </button>

      </section>

    </main>

  </div>


  <!-- =========================
       ガイド画面
       ========================= -->

  <div id="guideScreen" class="screen">

    <header class="guide-header">

      <button
        class="back-button"
        onclick="backToHome()"
        aria-label="ホームに戻る">
        ←
      </button>

      <h1 id="guideTitle">うどん</h1>

    </header>


    <main class="guide-main">

      <div class="guide-card">

        <img
          id="guideImage"
          class="guide-image"
          src=""
          alt=""
        >

      </div>


      <p class="guide-message">
        この盛り付けを見ながら置いてみよう。
      </p>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
