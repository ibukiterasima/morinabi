<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8FAF72">

  <title>もりナビ</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       ホーム画面
       ========================= -->

  <div id="homeScreen" class="screen active">

    <header class="header">
      <div class="logo">もりナビ</div>
    </header>


    <main class="home-main">

      <section class="hero">
        <h1>盛り付けを選ぼう</h1>
        <p>好きなカテゴリーから選んでね。</p>
      </section>


      <section class="categories">

        <button class="category" onclick="showDish('classic')">
          <img src="classic.PNG" alt="定番">
          <span>定番</span>
        </button>

        <button class="category" onclick="showDish('cafe')">
          <img src="cafe.PNG" alt="カフェ風">
          <span>カフェ風</span>
        </button>

        <button class="category" onclick="showDish('japanese food')">
          <img src="japanese food.PNG" alt="和食">
          <span>和食</span>
        </button>

        <button class="category" onclick="showDish('western-style food')">
          <img src="western-style food.PNG" alt="洋食">
          <span>洋食</span>
        </button>

        <button class="category" onclick="showDish('pasta')">
          <img src="pasta.PNG" alt="麺・パスタ">
          <span>麺・パスタ</span>
        </button>

        <button class="category" onclick="showDish('udon')">
          <img src="udon.PNG" alt="うどん">
          <span>うどん</span>
        </button>

        <button class="category" onclick="showDish('fruit')">
          <img src="fruit.jpg" alt="フルーツ">
          <span>フルーツ</span>
        </button>

        <button class="category" onclick="showDish('desert1')">
          <img src="desert1.PNG" alt="デザート">
          <span>デザート</span>
        </button>

        <button class="category" onclick="showDish('desert2')">
          <img src="desert2.PNG" alt="デザート2">
          <span>デザート 2</span>
        </button>

        <!-- 食卓 -->
        <button class="category" onclick="openTableMenu()">
          <div class="table-icon">食</div>
          <span>食卓</span>
        </button>

      </section>

    </main>

  </div>


  <!-- =========================
       食卓カテゴリー選択画面
       ========================= -->

  <div id="tableScreen" class="screen">

    <header class="guide-header">

      <button
        class="back-button"
        onclick="backToHome()"
        aria-label="ホームに戻る">
        ←
      </button>

      <h1>食卓</h1>

    </header>


    <main class="table-main">

      <h2>どんな食卓？</h2>


      <section class="table-categories">

        <button
          class="table-category"
          onclick="showTable('wasyoku')">

          <img src="wasyoku.png" alt="和食">

          <span>和食</span>

        </button>


        <button
          class="table-category"
          onclick="showTable('yousyoku')">

          <img src="yousyoku.png" alt="洋食">

          <span>洋食</span>

        </button>


        <button
          class="table-category"
          onclick="showTable('kobachi')">

          <img src="kobachi.png" alt="小鉢いっぱい">

          <span>小鉢いっぱい</span>

        </button>

      </section>

    </main>

  </div>


  <!-- =========================
       料理ガイド画面
       ========================= -->

  <div id="guideScreen" class="screen">

    <header class="guide-header">

      <button
        class="back-button"
        onclick="backToHome()"
        aria-label="ホームに戻る">
        ←
      </button>

      <h1 id="guideTitle">定番</h1>

    </header>


    <main class="guide-main">

      <div class="guide-card">

        <img
          id="guideImage"
          class="guide-image"
          src=""
          alt=""
        >

      </div>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
